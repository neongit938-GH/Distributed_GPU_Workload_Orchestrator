# Fairlane NFS registry: the ONLY place IDs are assigned.
# Every machine must use exactly these numbers. Change this file in git,
# then re-run sync_accounts.sh on every machine.

SERVER_EXPORT=/srv/fairlane
MOUNT_POINT=/mnt/shared_jobs

# Worker service account and group (jobs run as this UID inside containers)
WORKER_USER=fl_worker
WORKER_GROUP=compute_workers
WORKER_ID=2100

# Users: name:uid  (each user also gets a group with the same name and number)
# User IDs: 2001-2099. Next free: 2003. Never reuse a number.
USERS="fl_vansh:2001 fl_suryansh:2002"
